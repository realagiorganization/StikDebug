name: BDD Suite

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r bdd/requirements.txt
      - name: Run BDD suite
        run: behave bdd/features
      - name: Upload BDD artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-report
          path: reports || bdd

  vhs-gif:
    runs-on: ubuntu-latest
    needs: behave
    steps:
      - uses: actions/checkout@v4
      - name: Install VHS
        run: |
          curl -L https://github.com/charmbracelet/vhs/releases/download/v0.10.0/vhs_0.10.0_Linux_x86_64.tar.gz -o vhs.tgz
          tar -xzf vhs.tgz
          sudo mv vhs_0.10.0_Linux_x86_64/vhs /usr/local/bin/vhs
      - name: Record CLI demo
        run: |
          vhs assets/demo.tape
      - name: Upload GIF
        uses: actions/upload-artifact@v4
        with:
          name: vhs-gif
          path: assets/demo.gif
