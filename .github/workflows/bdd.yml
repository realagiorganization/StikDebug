name: BDD Suite

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behave:
    name: Behave Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BDD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bdd/requirements.txt
      - name: Run Behave suite
        run: |
          mkdir -p reports/behave
          python -m behave \
            --format progress2 \
            --junit \
            --junit-directory reports/behave \
            bdd/features
      - name: Upload Behave report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-report
          path: reports/behave

  vhs-demo:
    name: VHS Demo GIF
    runs-on: ubuntu-latest
    needs: behave
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BDD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bdd/requirements.txt
      - name: Record terminal demo
        uses: charmbracelet/vhs-action@v2
        with:
          path: assets/demo.tape
      - name: Upload demo GIF
        uses: actions/upload-artifact@v4
        with:
          name: vhs-demo-gif
          path: assets/demo.gif
